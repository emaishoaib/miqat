name: Miqat

options:
  bundleIdPrefix: com.mashoaib
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      MIQAT_SERVER_SCHEME: http
      MIQAT_SERVER_HOST: localhost:8000
    Release:
      MIQAT_SERVER_SCHEME: https

packages:
  PrayerKit:
    path: PrayerKit

targets:
  Miqat-iOS:
    type: application
    platform: iOS
    sources:
      - iOS
      - Shared
      - Icon/AppIcon.icon
    dependencies:
      - package: PrayerKit
      - target: Miqat-Widget
      - target: Miqat-watchOS
    entitlements:
      path: iOS/Miqat.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mashoaib.miqat]
    info:
      path: iOS/Info.plist
      properties:
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.mashoaib.miqat.daily-refresh]
        MiqatServerURL: $(MIQAT_SERVER_SCHEME)://$(MIQAT_SERVER_HOST)
    settings:
      base:
        PRODUCT_NAME: Miqat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Miqat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Miqat uses your location to find prayer times from the mosques nearest to you.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  Miqat-Widget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - WidgetShared
      - Shared/SunPathDial.swift
      - Shared/Appearance.swift
    dependencies:
      - package: PrayerKit
    entitlements:
      path: Widget/Miqat-Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mashoaib.miqat]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Miqat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat.widget
        TARGETED_DEVICE_FAMILY: "1"

  Miqat-macOS:
    type: application
    platform: macOS
    sources:
      - macOS
      - Shared
      - Icon/AppIcon.icon
    dependencies:
      - package: PrayerKit
    info:
      path: macOS/Info.plist
      properties:
        MiqatServerURL: $(MIQAT_SERVER_SCHEME)://$(MIQAT_SERVER_HOST)
    settings:
      base:
        PRODUCT_NAME: Miqat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Miqat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSLocationUsageDescription: Miqat uses your location to find prayer times from the mosques nearest to you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Miqat uses your location to find prayer times from the mosques nearest to you.

  Miqat-watchOS:
    type: application
    platform: watchOS
    sources:
      - watchOS
      - Shared/SunPathDial.swift
      - Icon/AppIcon.icon
    dependencies:
      - package: PrayerKit
      - target: Miqat-WatchWidget
    entitlements:
      path: watchOS/Miqat-watchOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mashoaib.miqat]
    info:
      path: watchOS/Info.plist
    settings:
      base:
        PRODUCT_NAME: Miqat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Miqat
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.mashoaib.miqat
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        TARGETED_DEVICE_FAMILY: "4"

  Miqat-WatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - WatchWidget
      - WidgetShared
      - Shared/SunPathDial.swift
    dependencies:
      - package: PrayerKit
    entitlements:
      path: WatchWidget/Miqat-WatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mashoaib.miqat]
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Miqat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
