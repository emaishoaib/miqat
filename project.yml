name: Miqat

options:
  bundleIdPrefix: com.mashoaib
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PrayerKit:
    path: PrayerKit

targets:
  Miqat-iOS:
    type: application
    platform: iOS
    sources: [iOS]
    dependencies:
      - package: PrayerKit
    settings:
      base:
        PRODUCT_NAME: Miqat
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Miqat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Miqat uses your location to find prayer times from the mosques nearest to you.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
