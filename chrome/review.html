<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Review timetable · Miqat</title>
    <link rel="stylesheet" href="review.css">
  </head>
  <body>
    <main>
      <h1>Review timetable</h1>
      <p id="source" class="secondary"></p>
      <p id="status"></p>
      <ul id="problems" hidden></ul>
      <table id="timetable" hidden>
        <thead>
          <tr>
            <th>Date</th>
            <th>Fajr</th>
            <th>Sunrise</th>
            <th>Dhuhr</th>
            <th>Asr</th>
            <th>Maghrib</th>
            <th>Isha</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="actions" hidden>
        <button id="upload"></button>
        <p id="result"></p>
        <ul id="rejections" hidden></ul>
      </div>
    </main>
    <script type="module" src="review.js"></script>
  </body>
</html>
