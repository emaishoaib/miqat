name: Miqat

options:
  bundleIdPrefix: com.mashoaib
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PrayerKit:
    path: PrayerKit

targets:
  Miqat-iOS:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    dependencies:
      - package: PrayerKit
      - target: Miqat-Widget
    entitlements:
      path: iOS/Miqat.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mashoaib.miqat]
    settings:
      base:
        PRODUCT_NAME: Miqat
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Miqat
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Miqat uses your location to find prayer times from the mosques nearest to you.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"

  Miqat-Widget:
    type: app-extension
    platform: iOS
    sources: [Widget, WidgetShared]
    dependencies:
      - package: PrayerKit
    entitlements:
      path: Widget/Miqat-Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mashoaib.miqat]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Miqat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat.widget
        TARGETED_DEVICE_FAMILY: "1"

  Miqat-macOS:
    type: application
    platform: macOS
    sources: [macOS, Shared]
    dependencies:
      - package: PrayerKit
    settings:
      base:
        PRODUCT_NAME: Miqat
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Miqat
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSLocationUsageDescription: Miqat uses your location to find prayer times from the mosques nearest to you.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Miqat uses your location to find prayer times from the mosques nearest to you.

  Miqat-watchOS:
    type: application
    platform: watchOS
    sources:
      - watchOS
      - Shared/TimetableModel.swift
    dependencies:
      - package: PrayerKit
      - target: Miqat-WatchWidget
    entitlements:
      path: watchOS/Miqat-watchOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mashoaib.miqat]
    settings:
      base:
        PRODUCT_NAME: Miqat
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Miqat
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.mashoaib.miqat
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Miqat uses your location to find prayer times from the mosques nearest to you.
        TARGETED_DEVICE_FAMILY: "4"

  Miqat-WatchWidget:
    type: app-extension
    platform: watchOS
    sources: [WatchWidget, WidgetShared]
    dependencies:
      - package: PrayerKit
    entitlements:
      path: WatchWidget/Miqat-WatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mashoaib.miqat]
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Miqat
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mashoaib.miqat.watchkitapp.widget
        TARGETED_DEVICE_FAMILY: "4"
