services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: miqat
      POSTGRES_PASSWORD: miqat
      POSTGRES_DB: miqat
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d

volumes:
  postgres-data:
